<!doctype html><meta charset=utf-8><style>body{width:300px;margin:0;padding:18px;color:#ece8de;font:14px system-ui;background:radial-gradient(300px 160px at 100% 0,#d4b06a1c,transparent),linear-gradient(180deg,#131316,#0a0a0c)}
.br{display:flex;align-items:center;gap:10px;margin-bottom:4px}.br svg{width:38px;height:38px}.wm{font:800 22px/1 Georgia,serif}.wm b{background:linear-gradient(180deg,#ecd49a,#a8864a);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:#8e8b83;font:italic 12px Georgia,serif;margin:0 0 14px}

button{cursor:pointer;font-weight:700;background:linear-gradient(180deg,#1d1d21,#151518)}button:hover{border-color:#d4b06a}#join,#start{background:linear-gradient(180deg,#e3c887,#b8934a);color:#17130a;border:0}
#msg{color:#d4b06a;min-height:1.2em;font-weight:600}a,small{color:#8e8b83;font-size:12px}</style>

 <p class=tag>Every Student, Every Move.</p>
